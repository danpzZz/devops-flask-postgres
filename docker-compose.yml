version: '3.9'

services:

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: empresa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@correo.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "8080:80"

    depends_on:
      - db

  app:
    build: .

    environment:
      APP_NAME: Sistema Productos
      APP_VERSION: 1.0.0
      DB_NAME: empresa
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_HOST: db

    ports:
      - "5000:5000"

    depends_on:
      - db

volumes:
  postgres_data: